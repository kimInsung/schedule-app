spring:
  application:
    name: schedule-app
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/schedule_app?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
